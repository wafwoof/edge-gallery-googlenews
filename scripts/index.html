<!DOCTYPE html>
<html lang="en">
<head></head>
<body>
  <script>
    async function ai_edge_gallery_get_result(data) {
      try {
        // const jsonData = JSON.parse(data);
        const jsonData = typeof data === 'string' ? JSON.parse(data) : data;
        const query = encodeURIComponent(jsonData.query);
        
        // Using Google News RSS via rss2json API as a reliable proxy that doesn't get blocked
        const targetUrl = `https://news.google.com/rss/search?q=${query}&hl=en-US&gl=US&ceid=US:en`;
        const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(targetUrl)}`;
        
        const response = await fetch(proxyUrl);
        
        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }
        
        const jsonResponse = await response.json();
        const searchResults = [];
        
        if (jsonResponse.items) {
          jsonResponse.items.forEach(item => {
            if (item.title && item.link) {
              searchResults.push({
                title: item.title,
                source: item.author || '',
                published: item.pubDate || '',
                link: item.link
              });
            }
          });
        }

        if (searchResults.length === 0) {
          return JSON.stringify({ result: "No results found." });
        }

        return JSON.stringify({
          result: searchResults.slice(0, 10)
        });
      } catch (e) {
        console.error(e);
        return JSON.stringify({
          error: `Failed to search: ${e.message}`
        });
      }
    };

    // test by rendering news about japan to the console

    //   console.log(result);
    // })();
  </script>
</body>
</html>
