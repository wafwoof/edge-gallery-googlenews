<!DOCTYPE html>
<html lang="en">
<head></head>
<body>
  <script>
    async function ai_edge_gallery_get_result(data) {
      try {
        const jsonData = JSON.parse(data);
        const query = encodeURIComponent(jsonData.query);
        
        // Using Google News RSS as it provides a reliable, parseable structure.
        // We use corsproxy.io to bypass browser CORS while testing locally.
        const targetUrl = `https://news.google.com/rss/search?q=${query}&hl=en-US&gl=US&ceid=US:en`;
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
        
        const response = await fetch(proxyUrl);
        
        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }
        
        const xmlText = await response.text();

        // Parse the XML
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        
        const items = xmlDoc.querySelectorAll('item');
        const searchResults = [];
        
        items.forEach(node => {
          const title = node.querySelector('title')?.textContent || '';
          const link = node.querySelector('link')?.textContent || '';
          const pubDate = node.querySelector('pubDate')?.textContent || '';
          const source = node.querySelector('source')?.textContent || '';
          
          if (title && link) {
            searchResults.push({
              title: title,
              source: source,
              published: pubDate,
              link: link
            });
          }
        });

        if (searchResults.length === 0) {
          return JSON.stringify({ result: "No results found." });
        }

        return JSON.stringify({
          result: searchResults.slice(0, 10)
        });
      } catch (e) {
        console.error(e);
        return JSON.stringify({
          error: `Failed to search: ${e.message}`
        });
      }
    };
  </script>
</body>
</html>
